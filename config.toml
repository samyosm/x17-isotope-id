FPGA3_ADCG = 4.0   # U2
FPGA3_ADCH = 4.0   # U1

# The detector response applied to the simulation's truth, to build the source shapes.
[response]
n0 = 30.6                # photoelectrons per MeV per PMT at z = 0; the simulation's own yield
spe_relative_sigma = 0.5 # single-photoelectron spread
kernel = "mix:0.2:6"     # [fitted] recorded fraction of a pulse (x17-data-analysis/scripts/kernel.py): 20 % of
                         # pulses at full amplitude, the rest log-uniform down to exp(-6). Fitted to the muon
                         # hits of 22-23 October; empirical, not explained.
adc_scale = 0.7          # [fitted] extra amplitude factor at low energy (21 October Cs-137 run)

