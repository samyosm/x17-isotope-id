# Calibration values in this file are marked with their origin:
#   [report]   taken from the summer 2026 internal technical note "Scintillator Calibration for
#              the X17 Experiment" (Laboratoire R.-J.-A.-Lévesque, Université de Montréal,
#              report.pdf), the lab's official calibration reference
#   [measured] read from the detector data with the Inspect page of the registry website
#              (scintillator 0, 30 minutes of run data, 2026-10-23); NOT in the report
#   [choice]   our own setting, with the reason given
# After changing digitization, filter or histogram values, regenerate the templates
# (scripts/initialize.py) and re-calibrate classifier.detection_threshold (src/main.py --evaluate).

[io]
tree = "vf48"
chunk_size = 100000
output_dir = "data"  # digitized and histogram files of every source go here

[digitization]
seed = 1729
adc_max = 32767

[defaults]
gain = 1.0                     # [choice] unverified: the report gives keV/ADC (gamma = 18.7-24.0, its Table 5),
                               # not ADC per photoelectron. The real muon peak is ~735-800 ADC (report, Sec. 2.4
                               # and Fig. 15); check with the ratio on the Inspect page once the filter is on.
spe_relative_sigma = 0.5
pedestal = 4.0                 # [measured] mean of the D0 (3) and U0 (5) baselines; other channels not yet measured
electronic_noise_sigma = 2.5   # [measured] mean of the D0 (1.9) and U0 (3.4) baseline spreads

# Channel-specific calibration overrides.
[channels.FPGA0_ADCA]          # D0, [measured]
pedestal = 3.0
electronic_noise_sigma = 1.9

[channels.FPGA2_ADCA]          # U0, [measured]
pedestal = 5.0
electronic_noise_sigma = 3.4

# Acquisition threshold on the stored ADC of the readings. Without it, baseline noise dominates the pairs.
[filter]
enabled = true  # [report] Sec. 4.2: radioisotope data is cleaned with a hard cut on both PMTs
mode = "both"   # [report] "U, D > 20 ADC"; "both" or "either"
threshold = 20  # [report] Sec. 4.2 (a higher value would cut the Cs-137 and Bi-207 Compton edges, ~18-50 ADC)


[histogram]
ref_fraction = 0.75  # fraction of matched U/D pairs in the reference histogram; the rest go to the test histogram
seed = 1729          # random assignment of pairs to reference/test
bins = 500          # [choice] 3 ADC per bin: the Cs-137, Bi-207 and Na-22 Compton edges lie at only ~18-50 ADC
min = 0.0
max = 1500.0        # [report] muon spectra of sqrt(UD) span 200-1500 ADC (Figs. 15-16); fixed so ref and test share bins
                    # histogram range of sqrt((U-PU)(D-PD))
# A PMT pair is a U row and a D row with the same _time and the same ADC letter,
# on FPGAs at the same position in these lists (D[i] <-> U[i]).
d_fpgas = [0, 1]
u_fpgas = [2, 3]

[classifier]
muon_isotope = "cosmic-muons"  # isotope label of the muon template, always included in the fit
pseudocount = 1e-3              # alpha added to every reference bin before normalizing
detection_threshold = 5.0     # 2*(NLL_muon_only - NLL_best) at or below this -> "muon-only"; to be calibrated on muon-only windows
window_size = 2000 # accepted measurements (pairs) per evaluation window
windows_per_class = 200 # windows per truth class and kind (pure, mixed)
mixed_fraction = 0.2           # isotope share of the measurements in a mixed window
seed = 1729                    # window construction

# Files processed by scripts/initialize.py.
# `path` (simulation file) is only needed to digitize/histogram. To only classify, a source may
# instead give `name` (the file name without .root) and just the data/NAME_digitized_histogram_ref.root
# file has to exist.

[[sources]]
path = "~/x17-detector-study/data/simulations/0=cosmic-muons-2026.10.13-seed1733.root"
isotope = "cosmic-muons"

[[sources]]
path = "~/x17-detector-study/data/simulations/308=Bi-207-2026.10.13-seed1731.root"
isotope = "Bi-207"

[[sources]]
path = "~/x17-detector-study/data/simulations/312=Cs-137-2026.10.13-seed1729.root"
isotope = "Cs-137"

[[sources]]
path = "~/x17-detector-study/data/simulations/319=Co-60-2026.10.13-seed1730.root"
isotope = "Co-60"

[[sources]]
path = "~/x17-detector-study/data/simulations/332=Na-22-2026.10.13-seed1732.root"
isotope = "Na-22"
