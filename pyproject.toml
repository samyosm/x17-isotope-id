[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "x17-isotope-id"
version = "0.1.0"
description = "Template-fit identification of the radioactive source near a scintillator"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "uproot"]

# Not installed by default (the server only needs the dependencies above):
#   uv sync --group scripts     scripts/ (digitize, histogram, initialize)
#   uv sync --group analysis    scripts/ and analysis/ figures
[dependency-groups]
scripts = ["awkward", "tqdm"]
analysis = ["awkward", "tqdm", "matplotlib"]

# The modules in src/ import each other by flat name, so they are installed as top-level
# modules. The entry point for other programs is `isotope_id`.
[tool.hatch.build.targets.wheel]
include = ["src/*.py"]
sources = ["src"]
